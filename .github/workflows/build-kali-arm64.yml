name: Build Kali Linux Live ARM64 ISO

on:
  push:
    tags:
      - 'v*'
      - 'nightly-*'
  
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v1.0.0 or nightly-2026-09-24'
        required: true
        type: string

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  OUT_DIR: ${{ github.workspace }}/output

jobs:
  build-arm64:
    name: Build and publish ARM64 Kali Live ISO
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: release-tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$PUSH_TAG"
          fi

          if [[ ! "$tag" =~ ^v.+$ && ! "$tag" =~ ^nightly-.+$ ]]; then
            echo "Invalid release tag: $tag"
            echo "The tag must start with 'v' or 'nightly-'."
            exit 1
          fi

          echo "Using release tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Clean runner disk
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          docker system prune --all --force --volumes || true
          docker image prune --all --force || true

          for path in \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules; do
            if [ -e "$path" ]; then
              sudo rm -rf "$path"
            fi
          done

          df -h

      - name: Install host prerequisites for non-Kali Ubuntu build
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            apt-utils \
            ca-certificates \
            cpio \
            gzip \
            debootstrap \
            wget \
            zstd

      - name: Install Kali archive keyring and live-build
        shell: bash
        run: |
          set -euxo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          cd "$workdir"

          keyring_package="$(
            wget -qO- \
              https://http.kali.org/pool/main/k/kali-archive-keyring/ \
              | grep -oE 'kali-archive-keyring_[^"]+_all\.deb' \
              | sort -V \
              | tail -n 1
          )"

          live_build_package="$(
            wget -qO- \
              https://http.kali.org/kali/pool/main/l/live-build/ \
              | grep -oE 'live-build_[^"]+%2Bkali[0-9]+_all\.deb' \
              | sort -V \
              | tail -n 1
          )"

          test -n "$keyring_package"
          test -n "$live_build_package"

          echo "Selected archive keyring: $keyring_package"
          echo "Selected Kali live-build: $live_build_package"

          wget \
            "https://http.kali.org/pool/main/k/kali-archive-keyring/$keyring_package"

          sudo apt-get install --yes "./$keyring_package"

          # Download using a stable local filename. This avoids issues caused
          # by wget handling the encoded %2B in the remote filename.
          wget \
            -O live-build.deb \
            "https://http.kali.org/kali/pool/main/l/live-build/$live_build_package"

          downloaded_version="$(dpkg-deb -f live-build.deb Version)"
          echo "Downloaded live-build version: $downloaded_version"

          test "$downloaded_version" = "1:20250814+kali3"

          sudo apt-get install --yes ./live-build.deb

          installed_version="$(dpkg-query -W -f='${Version}' live-build)"
          echo "Installed Kali live-build version: $installed_version"

          test "$installed_version" = "1:20250814+kali3"

      - name: Build Kali ARM64 live image
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$OUT_DIR"

          sudo --preserve-env=OUT_DIR env DEBUG=1 ./build.sh \
            --arch arm64 \
            --output "$OUT_DIR"

          sudo chown -R "$USER:$USER" "$OUT_DIR"

          find "$OUT_DIR" -maxdepth 1 -type f -name '*.iso' -print -quit | grep -q .

      - name: Compress ISO and generate SHA256 checksum
        shell: bash
        run: |
          set -euxo pipefail

          iso_file="$(find "$OUT_DIR" -maxdepth 1 -type f -name '*.iso' -print -quit)"
          compressed="${iso_file}.zst"

          zstd --ultra -19 -T0 --rm "$iso_file" -o "$compressed"
          sha256sum "$compressed" > "$compressed.sha256"

          test -s "$compressed"
          test -s "$compressed.sha256"

          cat "$compressed.sha256"
          ls -lh "$compressed" "$compressed.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release-tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Kali Linux ARM64 Live ${{ steps.release-tag.outputs.tag }}
          generate_release_notes: ${{ !startsWith(steps.release-tag.outputs.tag, 'nightly-') }}
          body: |
            Automated Kali Linux ARM64 live image.

            Build commit: ${{ github.sha }}
            Workflow run: ${{ github.run_id }}
          prerelease: ${{ startsWith(steps.release-tag.outputs.tag, 'nightly-') }}
          files: |
            ${{ env.OUT_DIR }}/*.iso.zst
            ${{ env.OUT_DIR }}/*.iso.zst.sha256
          fail_on_unmatched_files: true
